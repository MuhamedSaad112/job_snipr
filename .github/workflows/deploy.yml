name: Deploy JobSnipr to Azure

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  REGISTRY_NAME: telegrambotsregistry
  IMAGE_NAME: jobsnipr
  CONTAINER_APP_NAME: jobsnipr
  RESOURCE_GROUP: telegram-bots-de-rg

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Login to Azure Container Registry
        run: |
          az acr login --name $REGISTRY_NAME

      - name: Build and Push Docker Image
        run: |
          IMAGE_TAG=${{ github.sha }}

          docker build \
            -t $REGISTRY_NAME.azurecr.io/$IMAGE_NAME:$IMAGE_TAG \
            .

          docker push \
            $REGISTRY_NAME.azurecr.io/$IMAGE_NAME:$IMAGE_TAG
